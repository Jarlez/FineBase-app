<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>FineBase · Protótipo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="tokens.css"/>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg, #fafafa); }
    #app { height: 100%; }
    .fb-stage { width: 100%; height: 100%; }

    /* Floating switcher */
    .pv-bar {
      position: fixed;
      bottom: 16px; right: 16px;
      display: flex; gap: 6px;
      padding: 6px;
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e4e4e7);
      border-radius: 999px;
      box-shadow: 0 12px 32px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04);
      z-index: 1000;
      font-family: 'Geist', system-ui, sans-serif;
      font-size: 12px;
      align-items: center;
    }
    .pv-bar__group { display: flex; gap: 2px; padding: 2px; background: var(--bg-soft, #f4f4f5); border-radius: 999px; }
    .pv-bar button {
      border: 0; background: transparent;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--text-3, #71717a);
      font-weight: 500;
      letter-spacing: -0.01em;
      font-family: inherit; font-size: inherit;
    }
    .pv-bar button.is-on {
      background: var(--surface, #fff);
      color: var(--text, #09090b);
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    .pv-bar__sep { width: 1px; height: 18px; background: var(--border, #e4e4e7); }
    .pv-bar__lbl { color: var(--text-3, #71717a); padding: 0 6px 0 10px; font-weight: 500; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>

  <script type="text/babel" src="app/icons.jsx"></script>
  <script type="text/babel" src="app/charts.jsx"></script>
  <script type="text/babel" src="app/data.jsx"></script>
  <script type="text/babel" src="app/shell.jsx"></script>
  <script type="text/babel" src="app/screens.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function readState() {
      try {
        const u = new URL(location.href);
        return {
          variant: u.searchParams.get('v') || localStorage.getItem('fb-variant') || 'obsidian',
          theme:   u.searchParams.get('t') || localStorage.getItem('fb-theme')   || 'light',
          screen:  u.searchParams.get('s') || 'dashboard',
        };
      } catch { return { variant: 'obsidian', theme: 'light', screen: 'dashboard' }; }
    }

    function Prototype() {
      const init = readState();
      const [variant, setVariant] = useState(init.variant);
      const [theme,   setTheme]   = useState(init.theme);
      const [screen,  setScreen]  = useState(init.screen);
      const [modal,   setModal]   = useState(false);

      useEffect(() => { localStorage.setItem('fb-variant', variant); }, [variant]);
      useEffect(() => { localStorage.setItem('fb-theme', theme); }, [theme]);

      return (
        <>
          <AppFrame
            variant={variant}
            theme={theme}
            screen={screen}
            modal={modal}
            onNav={s => { setScreen(s); setModal(false); }}
            onAdd={() => setModal(true)}
            onCloseModal={() => setModal(false)}
            onToggleTheme={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
          />
          <div className={'pv-bar v-' + variant + (theme==='dark'?' dark':'')}>
            <span className="pv-bar__lbl">Variação</span>
            <div className="pv-bar__group">
              <button className={variant==='obsidian'?'is-on':''}   onClick={() => setVariant('obsidian')}>Obsidian</button>
              <button className={variant==='riverstone'?'is-on':''} onClick={() => setVariant('riverstone')}>Riverstone</button>
              <button className={variant==='voltage'?'is-on':''}    onClick={() => setVariant('voltage')}>Voltage</button>
            </div>
            <span className="pv-bar__sep"/>
            <div className="pv-bar__group">
              <button className={theme==='light'?'is-on':''} onClick={() => setTheme('light')}>Light</button>
              <button className={theme==='dark'?'is-on':''}  onClick={() => setTheme('dark')}>Dark</button>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<Prototype/>);
  </script>
</body>
</html>
